site_name: CS1 — Columbia Grammar
site_author: Katie Jergens
docs_dir: docs

theme:
  name: readthedocs

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: false
  - pymdownx.superfences
  - tables
  - admonition
  - attr_list

nav:
  - Home: index.md
  - Unit 1 — Binary, ASCII, and Scratch:
    - "1.1 How Computers Work + ASCII": unit1/notes_how_computers_work.md
    - "1.2 Binary Numbers": unit1/notes_binary_numbers.md
    - "1.2 Binary Addition & Multiplication": unit1/notes_binary_operations.md
    - "1.3 Scratch": unit1/notes_scratch.md
    - "Check Your Understanding": unit1/unit1_check_understanding.md
  - Unit 2 — Java Basics:
    - "2.1 Structure, Printing & Operators": unit2/notes_java_structure.md
    - "2.1 Variables and Data Types": unit2/notes_variables.md
    - "2.1 Re-assignment & Compound Assignment": unit2/notes_operators_reassignment.md
    - "2.2 Scanner and User Input": unit2/notes_scanner.md
    - "Check Your Understanding": unit2/unit2_check_understanding.md
  - Unit 3 — Conditionals and While Loops:
    - "3.1 Conditional Code Blocks": unit3/notes_conditionals.md
    - "3.2 While Loops": unit3/notes_while_loops.md
    - "Check Your Understanding": unit3/unit3_check_understanding.md
  - Unit 4 — For Loops:
    - "4.1 For Loops": unit4/notes_for_loops.md
    - "Check Your Understanding": unit4/unit4_check_understanding.md
  - Unit 5 — Strings and Math:
    - "5.1 Strings": unit5/notes_strings.md
    - "5.2 The Math Class": unit5/notes_math.md
    - "Check Your Understanding": unit5/unit5_check_understanding.md
  - Projects:
    - "Project 1: Scratch Remix": projects/project1.md
    - "Project 2: Word Guessing Adventure": projects/project2.md

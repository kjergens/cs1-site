site_name: CS1 - Columbia Grammar and Preparatory School
site_author: Katie Jergens
docs_dir: docs

theme:
  name: readthedocs

extra_javascript:
  - js/nav_scroll_fix.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: false
  - pymdownx.superfences
  - tables
  - admonition
  - attr_list

nav:
  - Home: index.md
  - Unit 1 - Binary, ASCII, and Scratch:
    - "Chapter 1: How Computers Work": unit1/notes_01_how_computers_work.md
    - "Chapter 2: Binary Numbers": unit1/notes_02_binary_numbers.md
    - "Chapter 3: Binary Arithmetic": unit1/notes_03_binary_operations.md
    - "Chapter 4: Scratch": unit1/notes_04_scratch.md
    - "Unit 1 Check Your Understanding": unit1/unit1_check_understanding.md
  - Unit 2 - Java Basics:
    - "Chapter 1: Structure, Printing & Operators": unit2/notes_01_java_structure.md
    - "Chapter 2: Variables and Data Types": unit2/notes_02_variables.md
    - "Chapter 3: Re-assignment & Compound Assignment": unit2/notes_03_operators_reassignment.md
    - "Chapter 4: Scanner and User Input": unit2/notes_04_scanner.md
    - "Unit 2 Check Your Understanding": unit2/unit2_check_understanding.md
  - Unit 3 - Conditionals and While Loops:
    - "Chapter 1: Conditional Code Blocks": unit3/notes_01_conditionals.md
    - "Chapter 2: While Loops": unit3/notes_02_while_loops.md
    - "Unit 3 Check Your Understanding": unit3/unit3_check_understanding.md
  - Unit 4 - For Loops:
    - "Chapter 1: For Loops": unit4/notes_01_for_loops.md
    - "Chapter 2: Advanced For Loops": unit4/notes_02_advanced_for_loops.md
    - "Unit 4 Check Your Understanding": unit4/unit4_check_understanding.md
  - Unit 5 - Strings and Math:
    - "Chapter 1: Strings": unit5/notes_01_strings.md
    - "Chapter 2: The Math Class": unit5/notes_02_math.md
    - "Unit 5 Check Your Understanding": unit5/unit5_check_understanding.md
  - Projects:
    - "Project 1: Scratch Remix": projects/project1.md
    - "Project 2: Word Guessing Adventure": projects/project2.md
